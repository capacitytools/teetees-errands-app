<!DOCTYPE html>
<html>
<head>
    <title>Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #F5F6FA; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #E8ECEF;
            max-width: 350px;
            width: 100%;
        }
        
        .error-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 15px;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        
        .error-title {
            font-size: 24px;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 8px;
        }
        
        .error-desc {
            color: #636E72;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 5px;
        }
        
        .error-code {
            font-size: 12px;
            color: #B2BEC3;
            margin-bottom: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        .btn-outline {
            width: 100%;
            padding: 14px;
            background: white;
            color: #FF6B35;
            border: 2px solid #E8ECEF;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        .error-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #E8ECEF;
        }
        
        .error-types .type {
            padding: 10px;
            background: #F8F9FA;
            border-radius: 8px;
            font-size: 11px;
            color: #636E72;
            cursor: pointer;
        }
        
        .error-types .type .icon { display: block; font-size: 20px; }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="error-icon">😅</span>
        <div class="error-title">Oops! Something went wrong</div>
        <div class="error-desc">
            We're having trouble processing your request.<br>
            Please try again.
        </div>
        <div class="error-code">Error Code: ERR-2024-001</div>
        
        <div class="btn-group">
            <button class="btn-primary">🔄 Retry</button>
            <button class="btn-outline">🏠 Go Back Home</button>
        </div>
        
        <div class="error-types">
            <div class="type">
                <span class="icon">📡</span>
                No Internet
            </div>
            <div class="type">
                <span class="icon">⏰</span>
                Timeout
            </div>
            <div class="type">
                <span class="icon">🔒</span>
                Access Denied
            </div>
            <div class="type">
                <span class="icon">📦</span>
                Not Found
            </div>
            <div class="type">
                <span class="icon">💳</span>
                Payment Failed
            </div>
            <div class="type">
                <span class="icon">⚙️</span>
                Server Error
            </div>
        </div>
    </div>
</body>
</html>
