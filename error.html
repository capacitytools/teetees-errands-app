<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Error</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-container {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid var(--border-color);
            max-width: 350px;
            width: 100%;
        }
        .error-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 15px;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        .error-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 5px;
        }
        .error-code {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-outline {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover { border-color: var(--primary); }
        .error-types {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }
        .error-types .type {
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
        }
        .error-types .type:hover { background: var(--primary); color: white; }
        .error-types .type .icon { display: block; font-size: 20px; }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="error-icon">😅</span>
        <div class="error-title">Oops! Something went wrong</div>
        <div class="error-desc">
            We're having trouble processing your request.<br>
            Please try again.
        </div>
        <div class="error-code">Error Code: ERR-2024-001</div>

        <div class="btn-group">
            <button class="btn-primary" onclick="location.reload()">🔄 Retry</button>
            <a href="app.html" class="btn-outline" style="text-decoration:none;display:block;">🏠 Go Back Home</a>
        </div>

        <div class="error-types">
            <div class="type"><span class="icon">📡</span>No Internet</div>
            <div class="type"><span class="icon">⏰</span>Timeout</div>
            <div class="type"><span class="icon">🔒</span>Access Denied</div>
            <div class="type"><span class="icon">📦</span>Not Found</div>
            <div class="type"><span class="icon">💳</span>Payment Failed</div>
            <div class="type"><span class="icon">⚙️</span>Server Error</div>
        </div>
    </div>

    <script src="/global.js"></script>
</body>
</html>
