<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading...</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        body {
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .loading-container {
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            margin: 20px auto;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 10px;
        }
        .dots {
            display: inline-block;
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        .progress-bar {
            width: 200px;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            margin: 20px auto;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            animation: progress 2s ease-in-out infinite;
            width: 0%;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .runner-animation {
            font-size: 60px;
            display: block;
            animation: run 1s ease-in-out infinite alternate;
        }
        @keyframes run {
            0% { transform: translateX(-20px); }
            100% { transform: translateX(20px); }
        }
        .sub-text {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <span class="runner-animation">🏃</span>
        <div class="logo">TEETEES</div>
        <div class="spinner"></div>
        <div class="text">Loading<span class="dots">...</span></div>
        <div class="progress-bar"><div class="fill"></div></div>
        <div class="sub-text">We're getting things ready for you</div>
    </div>

    <script src="/global.js"></script>
</body>
</html>
