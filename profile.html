<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .profile-header {
            text-align: center;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 30px 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 36px;
            color: white;
        }
        .profile-name { font-size: 20px; font-weight: bold; color: var(--text-primary); }
        .profile-email { color: var(--text-secondary); font-size: 14px; }
        .profile-since { color: var(--text-secondary); font-size: 12px; margin-top: 5px; }
        .loyalty-card {
            background: var(--primary-gradient);
            border-radius: var(--radius);
            padding: 20px;
            color: white;
            margin-bottom: 20px;
        }
        .loyalty-points { font-size: 32px; font-weight: bold; }
        .loyalty-label { font-size: 14px; opacity: 0.9; }
        .loyalty-progress {
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin-top: 10px;
        }
        .loyalty-progress .fill {
            height: 100%;
            background: white;
            border-radius: 3px;
            width: 65%;
        }
        .menu-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 15px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: var(--bg-secondary); }
        .menu-item .left { display: flex; align-items: center; gap: 12px; }
        .menu-item .icon { font-size: 20px; }
        .menu-item .label { font-weight: bold; }
        .menu-item .arrow { color: var(--text-secondary); font-size: 18px; }
        .menu-item .badge {
            background: var(--primary);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .logout-btn {
            width: 100%;
            padding: 15px;
            background: #FFEBEE;
            color: #FF1744;
            border: none;
            border-radius: var(--radius);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .logout-btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>

    <div class="header">
        <a href="app.html" class="back">←</a>
        <span class="title">Profile</span>
        <span style="font-size:20px;">⚙️</span>
    </div>

    <div class="profile-header animate-fade-in-up">
        <div class="avatar">👤</div>
        <div class="profile-name">Bukola Lawal</div>
        <div class="profile-email">bukola@teetees.com</div>
        <div class="profile-since">Customer since 2024</div>
    </div>

    <div class="loyalty-card animate-fade-in-up" style="animation-delay:0.1s;">
        <div class="loyalty-label">⭐ Your Rewards</div>
        <div class="loyalty-points">1,250 pts</div>
        <div style="font-size:13px;opacity:0.9;">250 pts to next reward</div>
        <div class="loyalty-progress"><div class="fill"></div></div>
    </div>

    <div class="menu-section">
        <a href="addresses.html" class="menu-item">
            <span class="left"><span class="icon">📍</span><span class="label">Saved Addresses</span></span>
            <span class="arrow">→</span>
        </a>
        <a href="#" class="menu-item">
            <span class="left"><span class="icon">💳</span><span class="label">Payment Methods</span></span>
            <span class="arrow">→</span>
        </a>
        <a href="referral.html" class="menu-item">
            <span class="left"><span class="icon">🎁</span><span class="label">Referral Program</span></span>
            <span class="badge">Earn</span>
            <span class="arrow">→</span>
        </a>
        <a href="loyalty.html" class="menu-item">
            <span class="left"><span class="icon">⭐</span><span class="label">Loyalty Points</span></span>
            <span class="arrow">→</span>
        </a>
        <a href="settings.html" class="menu-item">
            <span class="left"><span class="icon">⚙️</span><span class="label">Settings</span></span>
            <span class="arrow">→</span>
        </a>
    </div>

    <div class="menu-section">
        <a href="support.html" class="menu-item">
            <span class="left"><span class="icon">💬</span><span class="label">Help & Support</span></span>
            <span class="arrow">→</span>
        </a>
        <a href="about.html" class="menu-item">
            <span class="left"><span class="icon">ℹ️</span><span class="label">About Teetees</span></span>
            <span class="arrow">→</span>
        </a>
    </div>

    <button class="logout-btn">🚪 Logout</button>

    <div class="bottom-nav">
        <a href="app.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            Home
        </a>
        <a href="services.html" class="nav-item">
            <span class="nav-icon">📋</span>
            Services
        </a>
        <a href="history.html" class="nav-item">
            <span class="nav-icon">📦</span>
            Orders
        </a>
        <a href="profile.html" class="nav-item active">
            <span class="nav-icon">👤</span>
            Profile
        </a>
    </div>

    <script src="/global.js"></script>
</body>
</html>
