<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teetees</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        body {
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .splash-container {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .logo-icon {
            font-size: 80px;
            display: block;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .logo-text {
            font-size: 56px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 4px;
            margin: 5px 0;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(255,107,53,0.2); }
            100% { text-shadow: 0 0 30px rgba(255,107,53,0.4); }
        }
        .tagline {
            font-size: 22px;
            color: var(--text-primary);
            font-weight: 300;
            letter-spacing: 2px;
            animation: slideUp 1.5s ease-out 0.5s both;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            animation: slideUp 1.5s ease-out 0.8s both;
        }
        .loading-bar {
            width: 200px;
            height: 3px;
            background: var(--border-color);
            border-radius: 2px;
            margin: 30px auto 0;
            overflow: hidden;
            animation: slideUp 1.5s ease-out 1.2s both;
        }
        .loading-bar .fill {
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 2px;
            animation: load 2.5s ease-in-out infinite;
            width: 0%;
        }
        @keyframes load {
            0% { width: 0%; }
            50% { width: 80%; }
            100% { width: 100%; }
        }
        .shapes {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.05;
            animation: float-shape 20s linear infinite;
        }
        @keyframes float-shape {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100px, -100px) rotate(360deg); }
        }
        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: -100px;
            right: -100px;
        }
        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: #FFD700;
            bottom: -50px;
            left: -50px;
            animation-duration: 25s;
        }
        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: var(--primary);
            top: 50%;
            left: -80px;
            animation-duration: 30s;
        }

        /* Auto-redirect after 3 seconds */
        .redirect-timer {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 20px;
            animation: slideUp 1.5s ease-out 1.5s both;
        }
    </style>
</head>
<body>
    <div class="shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="splash-container">
        <span class="logo-icon">🏃</span>
        <div class="logo-text">TEETEES</div>
        <div class="tagline">WE RUN • YOU RELAX</div>
        <div class="sub">Your errands, Our priority.</div>
        <div class="loading-bar"><div class="fill"></div></div>
        <div class="redirect-timer">Taking you to the app...</div>
    </div>

    <script src="/global.js"></script>
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(function() {
            window.location.href = '/app.html';
        }, 3000);
    </script>
</body>
</html>
