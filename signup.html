<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: white; 
            padding: 30px 25px 30px;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header .logo {
            color: #FF6B35;
            font-weight: bold;
            font-size: 20px;
        }
        .header .login-link {
            color: #FF6B35;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;
        }
        
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #636E72;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #E8ECEF;
            border-radius: 12px;
            font-size: 14px;
            background: #F8F9FA;
        }
        .form-group input:focus {
            border-color: #FF6B35;
            outline: none;
        }
        .form-group .input-icon {
            position: relative;
        }
        .form-group .input-icon .icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }
        .form-group .input-icon input {
            padding-left: 45px;
        }
        
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 15px 0;
        }
        .terms input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #FF6B35;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .terms label {
            font-size: 13px;
            color: #636E72;
        }
        .terms label a {
            color: #FF6B35;
            font-weight: bold;
            text-decoration: none;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:hover { background: #E55A2B; }
        
        .login-link-bottom {
            text-align: center;
            color: #636E72;
            font-size: 14px;
            margin-top: 18px;
        }
        .login-link-bottom a {
            color: #FF6B35;
            font-weight: bold;
            text-decoration: none;
        }
        
        .wave-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, #FF6B35, #FF8F65);
            opacity: 0.1;
            border-radius: 100% 100% 0 0 / 50% 50% 0 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <span class="logo">TEETEES</span>
        <a href="login.html" class="login-link">Log In</a>
    </div>
    
    <!-- Title -->
    <div class="title">Create Account</div>
    <div class="subtitle">Join Teetees Errands today</div>
    
    <!-- Full Name -->
    <div class="form-group">
        <label>👤 Full Name</label>
        <div class="input-icon">
            <span class="icon">👤</span>
            <input type="text" placeholder="Enter your full name">
        </div>
    </div>
    
    <!-- Email -->
    <div class="form-group">
        <label>📧 Email Address</label>
        <div class="input-icon">
            <span class="icon">📧</span>
            <input type="email" placeholder="Enter your email">
        </div>
    </div>
    
    <!-- Phone -->
    <div class="form-group">
        <label>📱 Phone Number</label>
        <div class="input-icon">
            <span class="icon">📱</span>
            <input type="tel" placeholder="Enter your phone number">
        </div>
    </div>
    
    <!-- Password -->
    <div class="form-group">
        <label>🔒 Password</label>
        <div class="input-icon">
            <span class="icon">🔒</span>
            <input type="password" placeholder="Enter your password">
        </div>
    </div>
    
    <!-- Confirm Password -->
    <div class="form-group">
        <label>🔒 Confirm Password</label>
        <div class="input-icon">
            <span class="icon">🔒</span>
            <input type="password" placeholder="Confirm your password">
        </div>
    </div>
    
    <!-- Terms -->
    <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    </div>
    
    <!-- Sign Up Button -->
    <button class="btn-primary">🚀 Sign Up</button>
    
    <!-- Login Link -->
    <div class="login-link-bottom">
        Already have an account? <a href="login.html">Log In</a>
    </div>
    
    <!-- Wave Decoration -->
    <div class="wave-bottom"></div>
</body>
</html>
