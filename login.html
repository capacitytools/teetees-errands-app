<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        body {
            padding: 0;
            margin: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .top-section {
            background: var(--primary-gradient);
            padding: 50px 30px 40px;
            text-align: center;
            height: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .top-section .logo {
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        .top-section .welcome {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }
        .top-section .emoji-big { font-size: 60px; display: block; margin-bottom: 5px; }
        .bottom-section {
            flex: 1;
            padding: 30px 25px;
            background: var(--bg-primary);
            border-radius: 30px 30px 0 0;
            margin-top: -30px;
        }
        .bottom-section .title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 25px;
        }
        .forgot-link {
            text-align: right;
            color: var(--primary);
            font-size: 14px;
            font-weight: bold;
            margin-top: -10px;
            margin-bottom: 20px;
            display: block;
            text-decoration: none;
        }
        .signup-link {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 15px;
        }
        .signup-link a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }
        .social-section {
            margin-top: 20px;
            text-align: center;
        }
        .social-section .or {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 15px;
            display: block;
            position: relative;
        }
        .social-section .or::before,
        .social-section .or::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 1px;
            background: var(--border-color);
            top: 50%;
        }
        .social-section .or::before { left: 0; }
        .social-section .or::after { right: 0; }
        .social-buttons {
            display: flex;
            gap: 15px;
        }
        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--card-bg);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .social-btn:hover { border-color: var(--primary); }
        .social-btn .icon { font-size: 20px; }
    </style>
</head>
<body>
    <!-- No dark toggle on login page -->

    <div class="top-section">
        <span class="emoji-big">🏃</span>
        <div class="logo">TEETEES</div>
        <div class="welcome">Welcome Back</div>
    </div>

    <div class="bottom-section">
        <div class="title">Log In to Your Account</div>

        <div class="form-group">
            <label>📧 Email or Phone</label>
            <input type="text" placeholder="Enter your email or phone">
        </div>

        <div class="form-group">
            <label>🔒 Password</label>
            <input type="password" placeholder="Enter your password">
        </div>

        <a href="#" class="forgot-link">Forgot Password?</a>

        <a href="app.html" class="btn-primary">🔓 Log In</a>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>

        <div class="social-section">
            <span class="or">Or continue with</span>
            <div class="social-buttons">
                <button class="social-btn">
                    <span class="icon">🔵</span> Google
                </button>
                <button class="social-btn">
                    <span class="icon">🔷</span> Facebook
                </button>
            </div>
        </div>
    </div>

    <script src="/global.js"></script>
</body>
</html>
