<!DOCTYPE html>
<html>
<head>
    <title>Surprise Gift Delivery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #F5F6FA; 
            padding: 20px 15px 100px; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back { 
            font-size: 24px; 
            cursor: pointer; 
            text-decoration: none;
            color: #2D3436;
        }
        .title { 
            font-weight: bold; 
            font-size: 18px; 
            color: #2D3436; 
        }
        
        .confetti {
            text-align: center;
            font-size: 30px;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E8ECEF;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            font-family: Arial, sans-serif;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #E8ECEF;
        }
        .toggle-label { font-weight: bold; color: #2D3436; }
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #B2BEC3;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active { background: #FF6B35; }
        .toggle-switch .toggle-dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active .toggle-dot { left: 25px; }
        
        .gallery {
            margin: 20px 0;
        }
        .gallery-title {
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 10px;
        }
        .gallery-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 0;
        }
        .gift-item {
            min-width: 100px;
            background: white;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            border: 1px solid #E8ECEF;
            flex-shrink: 0;
        }
        .gift-item .gift-emoji { font-size: 40px; display: block; }
        .gift-item .gift-name { font-size: 12px; color: #2D3436; margin-top: 5px; }
        .gift-item .gift-price { font-size: 11px; color: #FF6B35; font-weight: bold; }
        
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:hover { background: #E55A2B; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="index.html" class="back">←</a>
        <span class="title">Surprise Gift Delivery</span>
        <span>🎁</span>
    </div>
    
    <!-- Confetti -->
    <div class="confetti">🎉 🎊 ✨</div>
    
    <!-- Recipient Name -->
    <div class="form-group">
        <label>👤 Recipient Name</label>
        <input type="text" placeholder="Enter recipient's full name">
    </div>
    
    <!-- Recipient Address -->
    <div class="form-group">
        <label>📍 Recipient Address</label>
        <input type="text" placeholder="Enter delivery address">
    </div>
    
    <!-- Gift Type -->
    <div class="form-group">
        <label>🎁 Gift Type</label>
        <select>
            <option>Select gift type</option>
            <option>Birthday</option>
            <option>Anniversary</option>
            <option>Just Because</option>
            <option>Congratulations</option>
            <option>Thank You</option>
        </select>
    </div>
    
    <!-- Budget -->
    <div class="form-group">
        <label>💰 Budget Range</label>
        <select>
            <option>Select budget range</option>
            <option>₦5,000 - ₦10,000</option>
            <option>₦10,000 - ₦25,000</option>
            <option>₦25,000 - ₦50,000</option>
            <option>₦50,000+</option>
        </select>
    </div>
    
    <!-- Special Occasion -->
    <div class="form-group">
        <label>🎊 Special Occasion</label>
        <input type="text" placeholder="What's the occasion?">
    </div>
    
    <!-- Personal Message -->
    <div class="form-group">
        <label>💌 Personal Message</label>
        <textarea placeholder="Write a personal message for the recipient"></textarea>
    </div>
    
    <!-- Gift Wrapping Toggle -->
    <div class="form-group">
        <label>🎀 Gift Wrapping</label>
        <div class="toggle-row">
            <span class="toggle-label">Add Gift Wrapping</span>
            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
    </div>
    
    <!-- Gift Gallery -->
    <div class="gallery">
        <div class="gallery-title">Choose from Our Gift Collection</div>
        <div class="gallery-scroll">
            <div class="gift-item">
                <span class="gift-emoji">🧸</span>
                <div class="gift-name">Teddy Bear</div>
                <div class="gift-price">₦5,000</div>
            </div>
            <div class="gift-item">
                <span class="gift-emoji">💐</span>
                <div class="gift-name">Flowers</div>
                <div class="gift-price">₦7,500</div>
            </div>
            <div class="gift-item">
                <span class="gift-emoji">🍫</span>
                <div class="gift-name">Chocolates</div>
                <div class="gift-price">₦3,500</div>
            </div>
            <div class="gift-item">
                <span class="gift-emoji">🛍️</span>
                <div class="gift-name">Gift Basket</div>
                <div class="gift-price">₦12,000</div>
            </div>
        </div>
    </div>
    
    <!-- Place Order Button -->
    <button class="btn-primary">🎁 Place Gift Order</button>
</body>
</html>
