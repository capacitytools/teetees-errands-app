<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise Gift Delivery</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .confetti {
            text-align: center;
            font-size: 30px;
            margin-bottom: 15px;
        }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
        .toggle-label { 
            font-weight: bold; 
            color: var(--text-primary); 
        }
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #B2BEC3;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-switch .toggle-dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active .toggle-dot { left: 25px; }
        
        .gallery {
            margin: 20px 0;
        }
        .gallery-title {
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .gallery-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 0;
        }
        .gift-item {
            min-width: 100px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .gift-item .gift-emoji { font-size: 40px; display: block; }
        .gift-item .gift-name { font-size: 12px; color: var(--text-primary); margin-top: 5px; }
        .gift-item .gift-price { font-size: 11px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="header">
        <a href="/services.html" class="back">←</a>
        <span class="title">Surprise Gift Delivery</span>
        <span>🎁</span>
    </div>
    
    <div class="confetti">🎉 🎊 ✨</div>
    
    <div class="form-group">
        <label>👤 Recipient Name</label>
        <input type="text" placeholder="Enter recipient's full name">
    </div>
    
    <div class="form-group">
        <label>📍 Recipient Address</label>
        <input type="text" placeholder="Enter delivery address">
    </div>
    
    <div class="form-group">
        <label>🎁 Gift Type</label>
        <select>
            <option>Select gift type</option>
            <option>Birthday</option>
            <option>Anniversary</option>
            <option>Just Because</option>
            <option>Congratulations</option>
            <option>Thank You</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>💰 Budget Range</label>
        <select>
            <option>Select budget range</option>
            <option>₦5,000 - ₦10,000</option>
            <option>₦10,000 - ₦25,000</option>
            <option>₦25,000 - ₦50,000</option>
            <option>₦50,000+</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>🎊 Special Occasion</label>
        <input type="text" placeholder="What's the occasion?">
    </div>
    
    <div class="form-group">
        <label>💌 Personal Message</label>
        <textarea placeholder="Write a personal message for the recipient"></textarea>
    </div>
    
    <div class="form-group">
        <label>🎀 Gift Wrapping</label>
        <div class="toggle-row">
            <span class="toggle-label">Add Gift Wrapping</span>
            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
    </div>
    
    <div class="gallery">
        <div class="gallery-title">Choose from Our Gift Collection</div>
        <div class="gallery-scroll">
            <div class="gift-item">
                <span class="gift-emoji">🧸</span>
                <div class="gift-name">Teddy Bear</div>
                <div class="gift-price">₦5,000</div>
            </div>
            <div class="gift-item">
                <span class="gift-emoji">💐</span>
                <div class="gift-name">Flowers</div>
                <div class="gift-price">₦7,500</div>
            </div>
            <div class="gift-item">
                <span class="gift-emoji">🍫</span>
                <div class="gift-name">Chocolates</div>
                <div class="gift-price">₦3,500</div>
            </div>
            <div class="gift-item">
                <span class="gift-emoji">🛍️</span>
                <div class="gift-name">Gift Basket</div>
                <div class="gift-price">₦12,000</div>
            </div>
        </div>
    </div>
    
    <button class="btn-primary">🎁 Place Gift Order</button>
    
    <script src="/global.js"></script>
</body>
</html>
