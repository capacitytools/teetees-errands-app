<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #F5F6FA; 
            padding: 20px 15px 100px; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back { 
            font-size: 24px; 
            cursor: pointer; 
            text-decoration: none;
            color: #2D3436;
        }
        .title { 
            font-weight: bold; 
            font-size: 18px; 
            color: #2D3436; 
        }
        
        .emoji-selector {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid #E8ECEF;
            margin-bottom: 20px;
        }
        .emoji-selector .question {
            font-weight: bold;
            color: #2D3436;
            font-size: 18px;
        }
        .emoji-selector .emojis {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        .emoji-selector .emojis .emoji {
            font-size: 48px;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.5;
        }
        .emoji-selector .emojis .emoji:hover { transform: scale(1.3); }
        .emoji-selector .emojis .emoji.active { 
            opacity: 1;
            transform: scale(1.2);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input[type="range"] {
            width: 100%;
            accent-color: #FF6B35;
        }
        .form-group .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #636E72;
        }
        
        .form-group .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .form-group .option-item {
            padding: 12px;
            border: 2px solid #E8ECEF;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #636E72;
            background: white;
        }
        .form-group .option-item.active {
            border-color: #FF6B35;
            color: #FF6B35;
            background: #FFF3E0;
        }
        
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E8ECEF;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            min-height: 100px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }
        
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .thank-you {
            background: #E8F5E9;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .thank-you .icon { font-size: 48px; display: block; }
        .thank-you .message { color: #00C853; font-weight: bold; font-size: 18px; margin-top: 5px; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="app.html" class="back">←</a>
        <span class="title">How Are We Doing?</span>
        <span>📝</span>
    </div>
    
    <!-- Emoji Selector -->
    <div class="emoji-selector">
        <div class="question">How was your experience?</div>
        <div class="emojis">
            <span class="emoji active">😊</span>
            <span class="emoji">😐</span>
            <span class="emoji">☹️</span>
        </div>
    </div>
    
    <!-- Satisfaction Slider -->
    <div class="form-group">
        <label>😊 How satisfied are you?</label>
        <input type="range" min="1" max="10" value="8">
        <div class="range-labels">
            <span>Very dissatisfied</span>
            <span>Very satisfied</span>
        </div>
    </div>
    
    <!-- Likelihood -->
    <div class="form-group">
        <label>⭐ How likely are you to recommend us?</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">1</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">2</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">3</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">4</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">5</span>
            <span style="padding:8px 12px;background:#FFF3E0;border-radius:8px;font-weight:bold;color:#FF6B35;cursor:pointer;border:2px solid #FF6B35;">6</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">7</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">8</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">9</span>
            <span style="padding:8px 12px;background:#E8ECEF;border-radius:8px;font-weight:bold;color:#636E72;cursor:pointer;">10</span>
        </div>
    </div>
    
    <!-- What to improve -->
    <div class="form-group">
        <label>🔧 What can we improve?</label>
        <div class="options-grid">
            <div class="option-item active">⚡ Speed</div>
            <div class="option-item">💰 Pricing</div>
            <div class="option-item">💬 Communication</div>
            <div class="option-item">⭐ Quality</div>
        </div>
    </div>
    
    <!-- Comments -->
    <div class="form-group">
        <label>📝 Additional Comments</label>
        <textarea placeholder="Tell us more about your experience..."></textarea>
    </div>
    
    <!-- Submit -->
    <button class="btn-primary">📤 Submit Feedback</button>
    
    <!-- Thank You -->
    <div class="thank-you">
        <span class="icon">🙏</span>
        <div class="message">Thank you for your feedback!</div>
        <div style="color:#636E72;font-size:14px;margin-top:5px;">We appreciate your input and will use it to improve.</div>
    </div>
</body>
</html>
