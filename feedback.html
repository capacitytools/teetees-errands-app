<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feedback</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .emoji-selector {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .emoji-selector .question {
            font-weight: bold;
            color: var(--text-primary);
            font-size: 18px;
        }
        .emoji-selector .emojis {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        .emoji-selector .emojis .emoji {
            font-size: 48px;
            cursor: pointer;
            transition: 0.2s;
            opacity: 0.5;
        }
        .emoji-selector .emojis .emoji:hover { transform: scale(1.3); }
        .emoji-selector .emojis .emoji.active {
            opacity: 1;
            transform: scale(1.2);
        }
        
        .form-group input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
        .form-group .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .option-item {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-secondary);
            background: var(--card-bg);
            transition: all 0.3s;
        }
        .option-item.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #FFF3E0;
        }
        
        .thank-you {
            background: #E8F5E9;
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        .thank-you .icon { font-size: 48px; display: block; }
        .thank-you .message { color: #00C853; font-weight: bold; font-size: 18px; margin-top: 5px; }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>

    <div class="header">
        <a href="app.html" class="back">←</a>
        <span class="title">How Are We Doing?</span>
        <span style="font-size:20px;">📝</span>
    </div>

    <div class="emoji-selector animate-fade-in-up">
        <div class="question">How was your experience?</div>
        <div class="emojis">
            <span class="emoji active" onclick="selectEmoji(this)">😊</span>
            <span class="emoji" onclick="selectEmoji(this)">😐</span>
            <span class="emoji" onclick="selectEmoji(this)">☹️</span>
        </div>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.1s;">
        <label>😊 How satisfied are you?</label>
        <input type="range" min="1" max="10" value="8">
        <div class="range-labels">
            <span>Very dissatisfied</span>
            <span>Very satisfied</span>
        </div>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.2s;">
        <label>⭐ How likely are you to recommend us?</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
            <span class="num-btn" onclick="selectNumber(this)">1</span>
            <span class="num-btn" onclick="selectNumber(this)">2</span>
            <span class="num-btn" onclick="selectNumber(this)">3</span>
            <span class="num-btn" onclick="selectNumber(this)">4</span>
            <span class="num-btn" onclick="selectNumber(this)">5</span>
            <span class="num-btn active" onclick="selectNumber(this)">6</span>
            <span class="num-btn" onclick="selectNumber(this)">7</span>
            <span class="num-btn" onclick="selectNumber(this)">8</span>
            <span class="num-btn" onclick="selectNumber(this)">9</span>
            <span class="num-btn" onclick="selectNumber(this)">10</span>
        </div>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.3s;">
        <label>🔧 What can we improve?</label>
        <div class="options-grid">
            <div class="option-item active" onclick="selectOption(this)">⚡ Speed</div>
            <div class="option-item" onclick="selectOption(this)">💰 Pricing</div>
            <div class="option-item" onclick="selectOption(this)">💬 Communication</div>
            <div class="option-item" onclick="selectOption(this)">⭐ Quality</div>
        </div>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.4s;">
        <label>📝 Additional Comments</label>
        <textarea placeholder="Tell us more about your experience..."></textarea>
    </div>

    <button class="btn-primary animate-fade-in-up" style="animation-delay:0.5s;" onclick="submitFeedback()">📤 Submit Feedback</button>

    <div class="thank-you" id="thankYou">
        <span class="icon">🙏</span>
        <div class="message">Thank you for your feedback!</div>
        <div style="color:var(--text-secondary);font-size:14px;margin-top:5px;">We appreciate your input and will use it to improve.</div>
    </div>

    <script src="/global.js"></script>
    <style>
        .num-btn {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .num-btn.active {
            background: #FFF3E0;
            color: var(--primary);
            border-color: var(--primary);
        }
        .num-btn:hover { border-color: var(--primary); }
    </style>
    <script>
        function selectEmoji(el) {
            document.querySelectorAll('.emoji-selector .emojis .emoji').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
        }
        function selectNumber(el) {
            document.querySelectorAll('.num-btn').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
        }
        function selectOption(el) {
            document.querySelectorAll('.option-item').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
        }
        function submitFeedback() {
            document.getElementById('thankYou').style.display = 'block';
            document.querySelector('.btn-primary').style.display = 'none';
        }
    </script>
</body>
</html>
