<!DOCTYPE html>
<html>
<head>
    <title>Grocery Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #F5F6FA; padding: 20px 15px 100px; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back { font-size: 24px; cursor: pointer; }
        .title { font-weight: bold; font-size: 18px; color: #2D3436; }
        .cart { font-size: 20px; cursor: pointer; }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E8ECEF;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            font-family: Arial, sans-serif;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .cost-calculator {
            background: #FFF3E0;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .cost-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #2D3436;
        }
        .cost-row.total { font-weight: bold; font-size: 18px; border-top: 2px solid #FF6B35; margin-top: 5px; padding-top: 12px; }
        
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:hover { background: #E55A2B; }
        
        .terms {
            text-align: center;
            color: #636E72;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="back">←</span>
        <span class="title">New Grocery Order</span>
        <span class="cart">🛒</span>
    </div>
    
    <div class="form-group">
        <label>📍 Delivery Address</label>
        <input type="text" placeholder="Enter delivery address">
    </div>
    
    <div class="form-group">
        <label>📅 Preferred Date & Time</label>
        <input type="text" placeholder="Select date and time">
    </div>
    
    <div class="form-group">
        <label>📝 Shopping List</label>
        <textarea placeholder="Enter items separated by commas (e.g., Rice 2kg, Milk 1L, Bread)"></textarea>
    </div>
    
    <div class="form-group">
        <label>📌 Special Instructions</label>
        <textarea placeholder="Any special instructions for the runner?"></textarea>
    </div>
    
    <div class="cost-calculator">
        <div class="cost-row"><span>Subtotal</span><span>₦0.00</span></div>
        <div class="cost-row"><span>Service Fee</span><span>₦0.00</span></div>
        <div class="cost-row total"><span>Total</span><span>₦0.00</span></div>
    </div>
    
    <button class="btn-primary">🛒 Place Order</button>
    <div class="terms">By placing this order, you agree to our Terms of Service</div>
</body>
</html>
