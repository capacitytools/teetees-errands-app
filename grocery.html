<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grocery Order</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="header">
        <a href="/services.html" class="back">←</a>
        <span class="title">New Grocery Order</span>
        <span class="cart">🛒</span>
    </div>
    
    <div class="form-group">
        <label>📍 Delivery Address</label>
        <input type="text" placeholder="Enter delivery address">
    </div>
    
    <div class="form-group">
        <label>📅 Preferred Date & Time</label>
        <input type="text" placeholder="Select date and time">
    </div>
    
    <div class="form-group">
        <label>📝 Shopping List</label>
        <textarea placeholder="Enter items separated by commas (e.g., Rice 2kg, Milk 1L, Bread)"></textarea>
    </div>
    
    <div class="form-group">
        <label>📌 Special Instructions</label>
        <textarea placeholder="Any special instructions for the runner?"></textarea>
    </div>
    
    <div class="card" style="background: #FFF3E0; border: none; border-top: 4px solid var(--primary);">
        <div style="display: flex; justify-content: space-between; padding: 8px 0; color: var(--text-primary);">
            <span>Subtotal</span><span>₦0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 8px 0; color: var(--text-primary);">
            <span>Service Fee</span><span>₦0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; padding: 12px 0; color: var(--text-primary); font-weight: bold; font-size: 18px; border-top: 2px solid var(--primary); margin-top: 5px; padding-top: 12px;">
            <span>Total</span><span>₦0.00</span>
        </div>
    </div>
    
    <button class="btn-primary">🛒 Place Order</button>
    <div style="text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 15px;">
        By placing this order, you agree to our Terms of Service
    </div>
    
    <script src="/global.js"></script>
</body>
</html>
