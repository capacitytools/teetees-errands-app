<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emergency</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .emergency-banner {
            background: linear-gradient(135deg, #FF1744, var(--primary));
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
            animation: pulse-bg 2s infinite;
        }
        @keyframes pulse-bg {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .emergency-banner .label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .emergency-banner .icon { font-size: 60px; display: block; margin: 5px 0; }
        .emergency-banner .title { font-size: 24px; font-weight: bold; }
        .emergency-banner .sub { font-size: 14px; opacity: 0.9; }

        .urgency-level {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .urgency-level .level {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            font-weight: bold;
            cursor: pointer;
            color: var(--text-secondary);
            background: var(--card-bg);
            transition: all 0.3s;
        }
        .urgency-level .level.active {
            border-color: #FF1744;
            color: #FF1744;
            background: #FFEBEE;
        }
        .urgency-level .level.high { border-color: var(--primary); color: var(--primary); }
        .urgency-level .level.high.active { background: #FFF3E0; }

        .priority-fee {
            background: #FFF3E0;
            border-radius: var(--radius);
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid var(--primary);
        }
        .priority-fee .row {
            display: flex;
            justify-content: space-between;
            color: var(--text-primary);
            font-size: 14px;
        }
        .priority-fee .row .label { color: var(--text-secondary); }
        .priority-fee .row .value { font-weight: bold; }

        .panic-btn {
            width: 100%;
            padding: 20px;
            background: #FF1744;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            animation: pulse-btn 1.5s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            transition: all 0.3s;
        }
        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .panic-btn:hover { animation: none; }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>

    <div class="header">
        <a href="services.html" class="back">←</a>
        <span class="title">Emergency Request</span>
        <span style="font-size:20px;">🆘</span>
    </div>

    <div class="emergency-banner animate-fade-in-up">
        <span class="icon">🚨</span>
        <div class="label">⚠️ EMERGENCY</div>
        <div class="title">Urgent Service</div>
        <div class="sub">Priority response • Immediate runner assignment</div>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.1s;">
        <label>🚨 Service Type</label>
        <select>
            <option>Select service type</option>
            <option>Medical Emergency</option>
            <option>Urgent Delivery</option>
            <option>Emergency Pickup</option>
            <option>Other</option>
        </select>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.2s;">
        <label>📍 Address</label>
        <input type="text" placeholder="Enter your current address">
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.3s;">
        <label>📱 Contact Person</label>
        <input type="text" placeholder="Enter contact name and phone">
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.4s;">
        <label>⚡ Urgency Level</label>
        <div class="urgency-level">
            <div class="level">Standard</div>
            <div class="level high">High</div>
            <div class="level active">🚨 Very Urgent</div>
        </div>
    </div>

    <div class="priority-fee animate-fade-in-up" style="animation-delay:0.5s;">
        <div class="row"><span class="label">Priority Service Fee</span><span class="value">₦2,500</span></div>
        <div class="row"><span class="label">Estimated Arrival</span><span class="value">10-15 min</span></div>
    </div>

    <div class="form-group animate-fade-in-up" style="animation-delay:0.6s;">
        <label>📝 Additional Details</label>
        <textarea placeholder="Describe your emergency..."></textarea>
    </div>

    <button class="panic-btn animate-fade-in-up" style="animation-delay:0.7s;">🚨 SEND HELP NOW</button>

    <button class="btn-primary animate-fade-in-up" style="animation-delay:0.8s;margin-top:10px;">📞 Request Emergency Service</button>

    <div style="text-align:center;color:var(--text-secondary);font-size:12px;margin-top:10px;">
        ⚡ You'll be connected to a runner immediately
    </div>

    <script src="/global.js"></script>
    <script>
        document.querySelectorAll('.urgency-level .level').forEach(level => {
            level.addEventListener('click', function() {
                document.querySelectorAll('.urgency-level .level').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
