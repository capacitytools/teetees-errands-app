<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prescription Pickup</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .security-badge {
            background: #E8F5E9;
            color: var(--success);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: var(--bg-secondary);
        }
        .upload-area .camera-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        .upload-area .upload-text {
            color: var(--text-primary);
            font-size: 14px;
        }
        .upload-area .upload-sub {
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        .secure-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="header">
        <a href="/services.html" class="back">←</a>
        <span class="title">Prescription Pickup</span>
        <span class="cart">💊</span>
    </div>
    
    <div class="security-badge">🔒 Secure & Confidential</div>
    
    <div class="form-group">
        <label>🏪 Pharmacy Name</label>
        <input type="text" placeholder="Enter pharmacy name">
    </div>
    
    <div class="form-group">
        <label>📍 Pharmacy Address</label>
        <input type="text" placeholder="Enter pharmacy address">
    </div>
    
    <div class="form-group">
        <label>📋 Prescription Details</label>
        <textarea placeholder="Enter prescription number or details"></textarea>
    </div>
    
    <div class="form-group">
        <label>📸 Upload Prescription Photo</label>
        <div class="upload-area">
            <span class="camera-icon">📷</span>
            <div class="upload-text">Tap to upload photo of prescription</div>
            <div class="upload-sub">JPG, PNG or PDF accepted</div>
        </div>
    </div>
    
    <div class="form-group">
        <label>👤 Patient Name</label>
        <input type="text" placeholder="Enter patient's full name">
    </div>
    
    <div class="form-group">
        <label>📅 Pickup Date & Time</label>
        <input type="text" placeholder="Select pickup date and time">
    </div>
    
    <button class="btn-primary">💊 Request Pickup</button>
    
    <div class="secure-text">Your prescription information is secure and confidential</div>
    
    <script src="/global.js"></script>
</body>
</html>
