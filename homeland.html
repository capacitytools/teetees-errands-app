<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taste of Homeland</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .flag-colors {
            display: flex;
            height: 4px;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
        }
        .flag-green1 { flex: 1; background: #008751; }
        .flag-white { flex: 1; background: white; }
        .flag-green2 { flex: 1; background: #008751; }
        
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding: 5px 0;
        }
        .category {
            padding: 8px 20px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            white-space: nowrap;
            font-weight: bold;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .category.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .product-emoji { font-size: 50px; display: block; margin: 5px 0; }
        .product-name { font-weight: bold; color: var(--text-primary); font-size: 14px; }
        .product-price { color: var(--primary); font-weight: bold; font-size: 14px; margin-top: 5px; }
        .product-origin { font-size: 11px; color: var(--text-secondary); }
        
        .build-package {
            text-align: center;
            padding: 15px;
            border: 2px dashed var(--primary);
            border-radius: var(--radius);
            margin-bottom: 20px;
            background: #FFF3E0;
            cursor: pointer;
        }
        .build-package .plus { font-size: 30px; color: var(--primary); }
        .build-package .text { font-weight: bold; color: var(--primary); }
        
        .currency-selector {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .currency {
            padding: 10px 20px;
            border-radius: var(--radius);
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .currency.active {
            border-color: var(--primary);
            background: #FFF3E0;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="header">
        <a href="/services.html" class="back">←</a>
        <span class="title">Taste of Homeland</span>
        <span>🇳🇬</span>
    </div>
    
    <div class="flag-colors">
        <div class="flag-green1"></div>
        <div class="flag-white"></div>
        <div class="flag-green2"></div>
    </div>
    
    <div class="categories">
        <div class="category active">Local Delicacies</div>
        <div class="category">Traditional Fabrics</div>
        <div class="category">Festive Items</div>
        <div class="category">Care Packages</div>
    </div>
    
    <div class="product-grid">
        <div class="product-card">
            <span class="product-emoji">🍲</span>
            <div class="product-name">Jollof Rice</div>
            <div class="product-price">₦5,000</div>
            <div class="product-origin">🇳🇬 Nigeria</div>
        </div>
        <div class="product-card">
            <span class="product-emoji">🥘</span>
            <div class="product-name">Egusi Soup</div>
            <div class="product-price">₦4,500</div>
            <div class="product-origin">🇳🇬 Nigeria</div>
        </div>
        <div class="product-card">
            <span class="product-emoji">👘</span>
            <div class="product-name">Ankara Fabric</div>
            <div class="product-price">₦8,000</div>
            <div class="product-origin">🇳🇬 Nigeria</div>
        </div>
        <div class="product-card">
            <span class="product-emoji">🎭</span>
            <div class="product-name">Festive Mask</div>
            <div class="product-price">₦3,000</div>
            <div class="product-origin">🇳🇬 Nigeria</div>
        </div>
    </div>
    
    <div class="build-package">
        <div class="plus">➕</div>
        <div class="text">Build Your Package</div>
        <div style="font-size:12px;color:var(--text-secondary);">Customize your own care package</div>
    </div>
    
    <div class="form-group">
        <label>🌍 Recipient Country</label>
        <select>
            <option>Select country</option>
            <option>United States</option>
            <option>United Kingdom</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Germany</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>📋 Customs Declaration</label>
        <textarea placeholder="Enter package contents for customs"></textarea>
    </div>
    
    <div class="form-group">
        <label>💰 Currency</label>
        <div class="currency-selector">
            <div class="currency active">₦ NGN</div>
            <div class="currency">$ USD</div>
            <div class="currency">£ GBP</div>
        </div>
    </div>
    
    <button class="btn-primary">🌍 Send Package</button>
    
    <script src="/global.js"></script>
</body>
</html>
