<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urgent Dispatch</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .express-badge {
            background: #FFF3E0;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .delivery-types {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .delivery-type {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: bold;
            color: var(--text-secondary);
            background: var(--card-bg);
            transition: all 0.3s;
        }
        .delivery-type.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #FFF3E0;
        }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: var(--primary);
        }
        .upload-area .camera-icon { font-size: 36px; display: block; }
        .upload-area .upload-text { 
            color: var(--text-secondary); 
            font-size: 14px; 
        }
        
        .price-card {
            background: #FFF3E0;
            padding: 15px;
            border-radius: var(--radius);
            margin: 20px 0;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-primary);
            padding: 5px 0;
        }
        .price-row.total { 
            font-weight: bold; 
            font-size: 18px; 
            border-top: 2px solid var(--primary);
            padding-top: 10px;
            margin-top: 5px;
        }
        .calculate-link { 
            color: var(--primary); 
            cursor: pointer; 
        }
        
        .priority-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }
        .toggle-label { 
            font-weight: bold; 
            color: var(--text-primary); 
        }
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #B2BEC3;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-switch .toggle-dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active .toggle-dot { left: 25px; }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="header">
        <a href="/services.html" class="back">←</a>
        <span class="title">Urgent Dispatch</span>
        <span>🚚</span>
    </div>
    
    <div class="express-badge">⚡ Express Available</div>
    
    <div class="form-group">
        <label>📍 Pickup Address</label>
        <input type="text" placeholder="Enter pickup address">
    </div>
    
    <div class="form-group">
        <label>📍 Delivery Address</label>
        <input type="text" placeholder="Enter delivery address">
    </div>
    
    <div class="form-group">
        <label>📦 Package Details</label>
        <textarea placeholder="Describe package (weight, dimensions, contents)"></textarea>
    </div>
    
    <div class="form-group">
        <label>📸 Package Photo</label>
        <div class="upload-area">
            <span class="camera-icon">📷</span>
            <div class="upload-text">Upload package photo (optional)</div>
        </div>
    </div>
    
    <div class="form-group">
        <label>⏱️ Delivery Type</label>
        <div class="delivery-types">
            <div class="delivery-type">Standard</div>
            <div class="delivery-type active">Same Day</div>
            <div class="delivery-type">Express</div>
        </div>
    </div>
    
    <div class="form-group">
        <label>🚨 Priority</label>
        <div class="priority-toggle">
            <span class="toggle-label">Priority handling</span>
            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
    </div>
    
    <div class="price-card">
        <div class="price-row"><span>Estimated Price</span><span>₦0.00</span></div>
        <div class="price-row"><span style="color:var(--primary);font-size:14px;">Calculate</span></div>
    </div>
    
    <button class="btn-primary">🚚 Book Dispatch</button>
    
    <script src="/global.js"></script>
</body>
</html>
