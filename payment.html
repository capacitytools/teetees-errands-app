<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #F5F6FA; 
            padding: 20px 15px 100px; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back { 
            font-size: 24px; 
            cursor: pointer; 
            text-decoration: none;
            color: #2D3436;
        }
        .title { 
            font-weight: bold; 
            font-size: 18px; 
            color: #2D3436; 
        }
        .lock-icon { font-size: 20px; }
        
        .security-badge {
            text-align: center;
            padding: 8px;
            background: #E8F5E9;
            border-radius: 10px;
            color: #00C853;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .payment-methods {
            background: white;
            border-radius: 12px;
            border: 1px solid #E8ECEF;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .method {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #F5F6FA;
            cursor: pointer;
        }
        .method:last-child { border-bottom: none; }
        .method .left { display: flex; align-items: center; gap: 12px; }
        .method .icon { font-size: 24px; }
        .method .name { font-weight: bold; color: #2D3436; }
        .method .radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #B2BEC3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .method .radio.active {
            border-color: #FF6B35;
        }
        .method .radio.active::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #FF6B35;
            border-radius: 50%;
        }
        
        .card-form {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #E8ECEF;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #2D3436;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E8ECEF;
            border-radius: 10px;
            font-size: 14px;
            background: white;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group { flex: 1; }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #E8ECEF;
            margin-bottom: 20px;
        }
        .toggle-label { font-weight: bold; color: #2D3436; font-size: 14px; }
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #B2BEC3;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active { background: #FF6B35; }
        .toggle-switch .toggle-dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active .toggle-dot { left: 25px; }
        
        .order-summary {
            background: #FFF3E0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #2D3436;
            font-size: 14px;
        }
        .summary-row.total {
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid #FF6B35;
            padding-top: 10px;
            margin-top: 5px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .security-footer {
            text-align: center;
            color: #636E72;
            font-size: 12px;
            margin-top: 15px;
        }
        .security-footer .badges { font-size: 20px; margin-top: 5px; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="details.html" class="back">←</a>
        <span class="title">Payment</span>
        <span class="lock-icon">🔒</span>
    </div>
    
    <!-- Security Badge -->
    <div class="security-badge">🔒 Secure & Encrypted Payment</div>
    
    <!-- Payment Methods -->
    <div class="payment-methods">
        <div class="method">
            <span class="left"><span class="icon">💳</span><span class="name">Card</span></span>
            <div class="radio active"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">🏦</span><span class="name">Bank Transfer</span></span>
            <div class="radio"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">📱</span><span class="name">USSD</span></span>
            <div class="radio"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">💰</span><span class="name">Wallet</span></span>
            <div class="radio"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">💵</span><span class="name">Cash on Delivery</span></span>
            <div class="radio"></div>
        </div>
    </div>
    
    <!-- Card Form -->
    <div class="card-form">
        <div class="form-group">
            <label>💳 Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>📅 Expiry</label>
                <input type="text" placeholder="MM/YY">
            </div>
            <div class="form-group">
                <label>🔐 CVV</label>
                <input type="text" placeholder="•••">
            </div>
        </div>
    </div>
    
    <!-- Save Card Toggle -->
    <div class="toggle-row">
        <span class="toggle-label">💾 Save Card for Future</span>
        <div class="toggle-switch active" onclick="this.classList.toggle('active')">
            <div class="toggle-dot"></div>
        </div>
    </div>
    
    <!-- Order Summary -->
    <div class="order-summary">
        <div class="summary-row"><span>Order Total</span><span>₦7,800</span></div>
        <div class="summary-row"><span>Service Fee</span><span>₦500</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span>₦1,000</span></div>
        <div class="summary-row total"><span>Total</span><span>₦9,300</span></div>
    </div>
    
    <!-- Pay Button -->
    <button class="btn-primary">🔒 Pay Now</button>
    
    <!-- Security Footer -->
    <div class="security-footer">
        <div>Secured by SSL • 256-bit Encryption</div>
        <div class="badges">🔒 🔐 🛡️</div>
    </div>
</body>
</html>
