<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payment</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .security-badge {
            text-align: center;
            padding: 8px;
            background: #E8F5E9;
            border-radius: var(--radius);
            color: #00C853;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .payment-methods {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .method {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
        }
        .method:last-child { border-bottom: none; }
        .method:hover { background: var(--bg-secondary); }
        .method .left { display: flex; align-items: center; gap: 12px; }
        .method .icon { font-size: 24px; }
        .method .name { font-weight: bold; color: var(--text-primary); }
        .method .radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .method .radio.active { border-color: var(--primary); }
        .method .radio.active::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }
        .card-form {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .toggle-label { font-weight: bold; color: var(--text-primary); font-size: 14px; }
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: var(--text-secondary);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-switch .toggle-dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active .toggle-dot { left: 25px; }
        .order-summary {
            background: #FFF3E0;
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: var(--text-primary);
            font-size: 14px;
        }
        .summary-row.total {
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid var(--primary);
            padding-top: 10px;
            margin-top: 5px;
        }
        .security-footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 15px;
        }
        .security-footer .badges { font-size: 20px; margin-top: 5px; }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>

    <div class="header">
        <a href="details.html" class="back">←</a>
        <span class="title">Payment</span>
        <span style="font-size:20px;">🔒</span>
    </div>

    <div class="security-badge">🔒 Secure & Encrypted Payment</div>

    <div class="payment-methods">
        <div class="method">
            <span class="left"><span class="icon">💳</span><span class="name">Card</span></span>
            <div class="radio active"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">🏦</span><span class="name">Bank Transfer</span></span>
            <div class="radio"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">📱</span><span class="name">USSD</span></span>
            <div class="radio"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">💰</span><span class="name">Wallet</span></span>
            <div class="radio"></div>
        </div>
        <div class="method">
            <span class="left"><span class="icon">💵</span><span class="name">Cash on Delivery</span></span>
            <div class="radio"></div>
        </div>
    </div>

    <div class="card-form">
        <div class="form-group">
            <label>💳 Card Number</label>
            <input type="text" placeholder="1234 5678 9012 3456">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>📅 Expiry</label>
                <input type="text" placeholder="MM/YY">
            </div>
            <div class="form-group">
                <label>🔐 CVV</label>
                <input type="text" placeholder="•••">
            </div>
        </div>
    </div>

    <div class="toggle-row">
        <span class="toggle-label">💾 Save Card for Future</span>
        <div class="toggle-switch active" onclick="this.classList.toggle('active')">
            <div class="toggle-dot"></div>
        </div>
    </div>

    <div class="order-summary">
        <div class="summary-row"><span>Order Total</span><span>₦7,800</span></div>
        <div class="summary-row"><span>Service Fee</span><span>₦500</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span>₦1,000</span></div>
        <div class="summary-row total"><span>Total</span><span>₦9,300</span></div>
    </div>

    <button class="btn-primary">🔒 Pay Now</button>

    <div class="security-footer">
        <div>Secured by SSL • 256-bit Encryption</div>
        <div class="badges">🔒 🔐 🛡️</div>
    </div>

    <script src="/global.js"></script>
    <script>
        // Method selection
        document.querySelectorAll('.method').forEach(method => {
            method.addEventListener('click', function() {
                document.querySelectorAll('.method .radio').forEach(r => r.classList.remove('active'));
                this.querySelector('.radio').classList.add('active');
            });
        });
    </script>
</body>
</html>
