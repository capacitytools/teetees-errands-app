<!DOCTYPE html>
<html>
<head>
    <title>Teetees Errands</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #F5F6FA; padding: 20px; }
        
        .header { text-align: center; padding: 40px 0 20px; }
        .logo { color: #FF6B35; font-size: 36px; font-weight: bold; }
        .tagline { color: #2D3436; font-size: 18px; }
        .sub { color: #636E72; font-size: 14px; }
        
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .nav-card {
            background: white;
            padding: 25px 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #2D3436;
            border-top: 4px solid #FF6B35;
        }
        .nav-card .icon { font-size: 36px; display: block; margin-bottom: 8px; }
        .nav-card .name { font-weight: bold; }
        .nav-card .desc { font-size: 11px; color: #636E72; margin-top: 4px; }
        
        .footer { text-align: center; margin-top: 40px; color: #636E72; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">TEETEES</div>
        <div class="tagline">WE RUN • YOU RELAX</div>
        <div class="sub">Your errands, Our priority.</div>
    </div>
    
    <div class="nav-grid">
        <a href="app.html" class="nav-card">
            <span class="icon">🏠</span>
            <div class="name">Home Dashboard</div>
            <div class="desc">See your recent orders</div>
        </a>
        <a href="services.html" class="nav-card">
            <span class="icon">📋</span>
            <div class="name">All Services</div>
            <div class="desc">Browse all our services</div>
        </a>
        <a href="grocery.html" class="nav-card">
            <span class="icon">🛒</span>
            <div class="name">Grocery Order</div>
            <div class="desc">Order groceries</div>
        </a>
        <a href="#" class="nav-card" style="opacity:0.5;">
            <span class="icon">➕</span>
            <div class="name">More Coming Soon</div>
            <div class="desc">Prescription, Gift & more</div>
        </a>
    </div>
    
    <div class="footer">
        Made with ❤️ for Teetees Errands<br>
        Your errands, Our priority.
    </div>
</body>
</html>
