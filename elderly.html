<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elderly Care & Support</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.jpg">
    <link rel="stylesheet" href="/global.css">
    <style>
        .service-options {
            margin: 15px 0;
        }
        .service-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .service-left { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .service-icon { font-size: 24px; }
        .service-name { 
            font-weight: bold; 
            color: var(--text-primary); 
        }
        .service-desc { 
            font-size: 12px; 
            color: var(--text-secondary); 
        }
        
        .toggle-switch {
            width: 50px;
            height: 28px;
            background: #B2BEC3;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active { background: var(--primary); }
        .toggle-switch .toggle-dot {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active .toggle-dot { left: 25px; }
        
        .emergency {
            border: 2px solid var(--danger);
            border-radius: var(--radius);
            padding: 15px;
            background: #FFF5F5;
            margin-bottom: 20px;
        }
        .emergency label { 
            color: var(--danger); 
            font-weight: bold; 
            display: block;
            margin-bottom: 5px;
        }
        .emergency input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--danger);
            border-radius: var(--radius);
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
        }
    </style>
</head>
<body>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDarkMode()">🌙</button>
    
    <div class="header">
        <a href="/services.html" class="back">←</a>
        <span class="title">Elderly Care & Support</span>
        <span>❤️</span>
    </div>
    
    <div class="service-options">
        <div class="service-option">
            <div class="service-left">
                <span class="service-icon">🛒</span>
                <div><div class="service-name">Grocery Help</div><div class="service-desc">Shop and deliver groceries</div></div>
            </div>
            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
        
        <div class="service-option">
            <div class="service-left">
                <span class="service-icon">💊</span>
                <div><div class="service-name">Prescription Runs</div><div class="service-desc">Pick up medications</div></div>
            </div>
            <div class="toggle-switch active" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
        
        <div class="service-option">
            <div class="service-left">
                <span class="service-icon">🤝</span>
                <div><div class="service-name">Companion Visits</div><div class="service-desc">Friendly visits and check-ins</div></div>
            </div>
            <div class="toggle-switch" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
        
        <div class="service-option">
            <div class="service-left">
                <span class="service-icon">🏥</span>
                <div><div class="service-name">Medical Appointments</div><div class="service-desc">Transport to appointments</div></div>
            </div>
            <div class="toggle-switch" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
        
        <div class="service-option">
            <div class="service-left">
                <span class="service-icon">📞</span>
                <div><div class="service-name">Daily Check-ins</div><div class="service-desc">Regular phone/video check-ins</div></div>
            </div>
            <div class="toggle-switch" onclick="this.classList.toggle('active')">
                <div class="toggle-dot"></div>
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <label>👤 Elderly Person's Name</label>
        <input type="text" placeholder="Enter elderly person's name">
    </div>
    
    <div class="form-group">
        <label>📱 Contact Person</label>
        <input type="text" placeholder="Enter primary contact name and phone">
    </div>
    
    <div class="form-group">
        <label>📅 Care Schedule</label>
        <input type="text" placeholder="Select preferred schedule">
    </div>
    
    <div class="form-group">
        <label>📝 Special Needs/Notes</label>
        <textarea placeholder="Any special needs or medical conditions?"></textarea>
    </div>
    
    <div class="emergency">
        <label>🚨 Emergency Contact Number</label>
        <input type="text" placeholder="Enter emergency contact number">
    </div>
    
    <button class="btn-primary">❤️ Request Assistance</button>
    
    <script src="/global.js"></script>
</body>
</html>
